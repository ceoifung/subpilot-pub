name: Publish Models

on:
  workflow_dispatch:
  repository_dispatch:
    types: [models]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: 下载 Lada 模型
        shell: bash
        run: |
          mkdir m && cd m
          for f in lada_mosaic_detection_model_v4_fast.pt \
                   lada_mosaic_detection_model_v4_accurate.pt \
                   lada_mosaic_detection_model_v2.pt \
                   lada_mosaic_restoration_model_generic_v1.2.pth; do
            curl -fL --retry 3 -O "https://huggingface.co/ladaapp/lada/resolve/main/$f"
          done
          sha256sum lada_* > SHA256SUMS.txt
          ls -la

      - name: 发布到 models-v1 Release
        shell: bash
        working-directory: m
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view models-v1 --repo ceoifung/yingzhen-pub > /dev/null 2>&1 || \
            gh release create models-v1 --repo ceoifung/yingzhen-pub \
              --title "Lada 模型包" --notes "检测x3 + 修复x1, 供映真使用 | 放置: 程序文件夹内 lada/model_weights/ | 匿名可下载 | ProPainter 权重因授权限制仅在私有渠道提供"
          gh release upload models-v1 --repo ceoifung/yingzhen-pub --clobber \
            lada_mosaic_detection_model_v4_fast.pt lada_mosaic_detection_model_v4_accurate.pt \
            lada_mosaic_detection_model_v2.pt lada_mosaic_restoration_model_generic_v1.2.pth \
            SHA256SUMS.txt
          echo "上传完成"
