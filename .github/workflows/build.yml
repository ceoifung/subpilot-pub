name: Build Release

on:
  repository_dispatch:
    types: [build]
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的 tag (如 v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            variant: cpu
            bundles: nsis
          - os: windows-latest
            variant: gpu
            bundles: nsis
          - os: ubuntu-22.04
            variant: cpu
            bundles: deb
          - os: ubuntu-22.04
            variant: gpu
            bundles: deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      VARIANT: ${{ matrix.variant }}
      BUNDLES: ${{ matrix.bundles }}

    steps:
      - name: 解析版本
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            TAG="${{ github.event.client_payload.tag }}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "构建: $TAG variant=$VARIANT ($RUNNER_OS)"

      - name: 拉取私有仓库源码
        shell: bash
        env:
          TOKEN: ${{ secrets.PRIVATE_PULL_TOKEN }}
        run: |
          git clone --depth 1 --branch "$TAG" \
            "https://x-access-token:${TOKEN}@github.com/ceoifung/subpilot-rs.git" app
          cd app && git log --oneline -1

      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            build-essential curl wget file libssl-dev cmake

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: 定位 CUDA 工具链 (GPU 版)
        if: matrix.variant == 'gpu'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            NVCC="$(command -v nvcc || true)"
            if [ -z "$NVCC" ]; then
              for d in "/c/Program Files/NVIDIA GPU Computing Toolkit/CUDA"/*/bin/nvcc.exe; do
                NVCC="$d"; break
              done
            fi
            CUDA_BIN=$(dirname "$NVCC")
            echo "CUDA_PATH=$(cygpath -w "$CUDA_BIN/..")" >> $GITHUB_ENV
            echo "PATH=$CUDA_BIN:$PATH" >> $GITHUB_ENV
            echo "CUDA_BIN=$CUDA_BIN" >> $GITHUB_ENV
          else
            echo "PATH=/usr/local/cuda/bin:$PATH" >> $GITHUB_ENV
            echo "CUDA_BIN=/usr/local/cuda/bin" >> $GITHUB_ENV
          fi
          nvcc --version | tail -2

      - name: 安装前端依赖 + 准备 ffmpeg/CUDA 运行库
        shell: bash
        working-directory: app
        run: |
          npm ci
          mkdir -p src-tauri/ffmpeg/bin src-tauri/cuda
          touch src-tauri/cuda/.gitkeep
          if [ "$RUNNER_OS" = "Linux" ]; then
            cp "$(command -v ffmpeg)" src-tauri/ffmpeg/bin/ffmpeg
          else
            curl -sL -o /tmp/ff.zip "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip"
            unzip -o -j /tmp/ff.zip "*/bin/ffmpeg.exe" -d src-tauri/ffmpeg/bin/
          fi
          # GPU 版(Windows): cudart/cublas 随包分发, 用户免装 CUDA 运行库
          if [ "$VARIANT" = "gpu" ] && [ "$RUNNER_OS" = "Windows" ]; then
            cp "$CUDA_BIN"/cudart64_*.dll "$CUDA_BIN"/cublas64_*.dll "$CUDA_BIN"/cublasLt64_*.dll src-tauri/cuda/
            ls -la src-tauri/cuda/
          fi

      - name: 构建 (CPU 版)
        if: matrix.variant == 'cpu'
        shell: bash
        working-directory: app
        run: npx tauri build --bundles "$BUNDLES"

      - name: 构建 (GPU 版, 识别走 CUDA)
        if: matrix.variant == 'gpu'
        shell: bash
        working-directory: app
        run: npx tauri build --bundles "$BUNDLES" -- --features cuda

      - name: 上传产物到 Release
        shell: bash
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUFFIX=""
          [ "$VARIANT" = "gpu" ] && SUFFIX="-GPU"
          if [ "$RUNNER_OS" = "Windows" ]; then
            SRC=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
            ASSET="SubPilot-${VERSION}-x64${SUFFIX}-setup.exe"
          else
            SRC=$(ls src-tauri/target/release/bundle/deb/*.deb)
            ASSET="subpilot-${VERSION}-amd64${SUFFIX}.deb"
          fi
          cp "$SRC" "$ASSET"
          echo "上传: $ASSET ($(du -h "$ASSET" | cut -f1))"
          gh release view "$TAG" --repo ceoifung/subpilot-pub > /dev/null 2>&1 || \
            gh release create "$TAG" --repo ceoifung/subpilot-pub \
              --title "SubPilot $TAG" \
              --notes "SubPilot 双语字幕播放器 $TAG — 自动构建。CPU 版通用; -GPU 版显存自适应: 识别恒走GPU, 剩余显存≥10GB时翻译也上GPU。模型请见 models-v1 Release 或 README。模型请见 models-v1 Release 或 README。" \
              --target main
          gh release upload "$TAG" --repo ceoifung/subpilot-pub --clobber "$ASSET"
